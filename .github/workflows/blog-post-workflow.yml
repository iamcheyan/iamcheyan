name: Latest Blog Post Workflow

on:
  # 每 2 小时自动运行一次
  schedule:
    - cron: '0 */2 * * *'
  
  # 允许手动运行工作流
  workflow_dispatch:

permissions:
  contents: write  # 用于将生成的内容写入 README

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Pull in blog's posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # 替换为你的博客 RSS 链接
          feed_list: "https://your-blog.com/rss.xml"
          
          # 可选配置
          # max_post_count: 5  # 显示的文章数量
          # comment_tag_name: BLOG-POST-LIST  # 注释标签名称
          # template: "$newline - $randomEmoji(🔥,💡,📝,📚) **[$title]($url)** $newline$newline> $description $newline"

