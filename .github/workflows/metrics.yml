name: Metrics

on:
  # 每小时自动更新
  schedule:
    - cron: "0 * * * *"
  
  # 允许手动运行工作流
  workflow_dispatch:
  
  # 每次推送到 master/main 分支时运行
  push:
    branches:
      - master
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # 你的 GitHub token
          # 需要以下权限：
          #  - public_access (默认权限)
          # 以下额外权限可能需要：
          #  - read:org      (用于组织相关统计)
          #  - read:user     (用于用户相关数据)
          #  - read:packages (用于某些包相关数据)
          #  - repo          (可选，如果你想包含私有仓库)
          token: ${{ secrets.METRICS_TOKEN }}
          
          # 配置选项
          user: iamcheyan  # GitHub 用户名
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          
          # 可选：配置其他选项
          # plugin_achievements: yes
          # plugin_contributors: yes
          # plugin_discussions: yes
          # plugin_followup: yes
          # plugin_habits: yes
          # plugin_isocalendar: yes
          # plugin_languages: yes
          # plugin_lines: yes
          # plugin_notable: yes
          # plugin_people: yes
          # plugin_pagespeed: yes
          # plugin_posts: yes
          # plugin_reactions: yes
          # plugin_skylines: yes
          # plugin_sponsors: yes
          # plugin_stargazers: yes
          # plugin_starlists: yes
          # plugin_stars: yes
          # plugin_traffic: yes

